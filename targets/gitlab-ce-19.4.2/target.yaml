    sha256: efb10ee83f4462799cc8428e7fb2e8bb4b3227517b87a2477f88e98e13b12dad
    dest: package
  - kind: deb
    arch: amd64
    url: https://packages.gitlab.com/gitlab/gitlab-ce/ubuntu/pool/main/g/gitlab-ce/gitlab-ce_19.4.2-ce.0_amd64.deb
    sha256: 0fe8bb04aeb37d2aa73109755914e9465ae7adf83552bc3840187eafd181d103
